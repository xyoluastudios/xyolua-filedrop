<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XyoLua FileDrop</title>
    <meta name="description" content="Someone shared files with you. The link expires automatically." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#07080c" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="XyoLua FileDrop" />
    <meta property="og:description" content="Someone shared files with you. The link expires automatically." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/assets/drop.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <a class="brand" href="/">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <defs>
              <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#a78bfa" />
                <stop offset=".5" stop-color="#6366f1" />
                <stop offset="1" stop-color="#22d3ee" />
              </linearGradient>
            </defs>
            <rect width="32" height="32" rx="9" fill="url(#logo-g)" />
            <path d="M16 6.2c-4 4.7-6.6 8.2-6.6 11.4a6.6 6.6 0 0 0 13.2 0c0-3.2-2.6-6.7-6.6-11.4z" fill="#fff" />
            <path d="M16 21.6v-6.2m0 0-2.7 2.7m2.7-2.7 2.7 2.7" stroke="#5b47e0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          </svg>
          <span data-site-name>XyoLua FileDrop</span>
        </a>
        <nav class="top-nav">
          <button class="ghost-btn" type="button" data-lang-toggle><span data-icon="globe"></span><span class="label">Deutsch</span></button>
          <a class="ghost-btn" href="https://github.com/xyoluastudios/xyolua-filedrop" target="_blank" rel="noopener noreferrer">
            <span data-icon="code"></span><span class="label" data-i18n="nav.source">Source code</span>
          </a>
        </nav>
      </header>

      <main>
        <section class="card" id="view">
          <div class="drop-head">
            <div class="status-icon lock"><span data-icon="files"></span></div>
            <div>
              <span class="sr-only" data-i18n="drop.loading">Loading drop</span>
            </div>
          </div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </section>
      </main>

      <footer class="foot">
        <span><span data-site-name>XyoLua FileDrop</span> <span data-version></span></span>
        <span>
          <a href="https://github.com/xyoluastudios/xyolua-filedrop" target="_blank" rel="noopener noreferrer" data-i18n="footer.oss">Open source · MIT license</a>
          <span class="sep">/</span>
          <a href="https://github.com/xyoluastudios/xyolua-filedrop#self-hosting" target="_blank" rel="noopener noreferrer" data-i18n="footer.selfhost">Host your own</a>
        </span>
      </footer>
    </div>
    <div class="toasts" id="toasts"></div>
  </body>
</html>
